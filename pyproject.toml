[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mocap-blender"
version = "0.1.0.dev0"
description = "P5: from a take's 3D to a character in Blender, run headless from WSL"
readme = "README.md"
# The pure-Python parts also run inside Blender 5.2.2 (bundled Python 3.13).
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mocap-blender = "mocap_blender.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
